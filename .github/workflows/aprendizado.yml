name: Gerar páginas derivadas

# Roda a cada push na main e regenera o que é DERIVADO do repositório:
#
#   aprendizado.html  <- blocos "Aprendi:" das mensagens de commit
#   sitemap.xml       <- data do último commit que tocou cada página
#
# As duas coisas já existiam no git; o trabalho aqui é só transformá-las em
# página. Nada precisa ser feito à mão — nem clonar o repo, nem rodar script.

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write           # necessário para commitar as páginas geradas

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório com o histórico completo
        uses: actions/checkout@v4
        with:
          # sem isso o checkout traz só o último commit e o git log fica vazio
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar aprendizado.html
        run: python3 gerar-aprendizado.py

      # Depois do aprendizado, de propósito: o gerador do sitemap detecta que
      # aprendizado.html acabou de mudar e usa a data de hoje para ele, em vez
      # da data da alteração anterior.
      - name: Gerar sitemap.xml
        run: python3 gerar-sitemap.py

      - name: Publicar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Se nada mudou, não faz commit — evita histórico poluído
          if git diff --quiet -- aprendizado.html sitemap.xml; then
            echo "Nada mudou. Nenhum commit necessário."
            exit 0
          fi

          git add aprendizado.html sitemap.xml
          # [skip ci] impede que este commit dispare o workflow de novo,
          # o que criaria um laço infinito de builds
          git commit -m "chore: atualiza paginas derivadas [skip ci]"
          git push
